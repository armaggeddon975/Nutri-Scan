services:
  postgres:
    image: postgres:16-alpine
    container_name: nutriva-postgres-dev
    environment:
      POSTGRES_DB: nutriva
      POSTGRES_USER: nutriva
      POSTGRES_PASSWORD: nutriva_dev_password
    ports:
      - "5432:5432"
    volumes:
      - nutriva_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nutriva -d nutriva"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nutriva_postgres_data:
