# Blueprint do Render para o NutriScan.
#
# Um unico web service serve a API e o frontend ja compilado, na mesma origem.
# O PostgreSQL fica no Neon: o plano gratuito do Render expira em 90 dias e
# apaga os dados, o do Neon nao.
#
# Variaveis marcadas com `sync: false` NAO ficam neste arquivo: elas sao
# preenchidas no painel do Render, para nao entrarem no Git.

services:
  - type: web
    # Nome preservado: o servico ja existe no Render com este nome e a URL
    # publica deriva dele. Renomear aqui nao renomeia o servico existente, e
    # renomear no painel troca a URL. Fica para uma migracao planejada.
    name: nutriscan
    runtime: node
    plan: free
    healthCheckPath: /api/health
    # `--include=dev` e obrigatorio: com NODE_ENV=production o npm ci descarta
    # devDependencies, e o vite (que compila o frontend) e devDependency.
    # Sem isso o build morre com "vite: not found".
    buildCommand: npm ci --include=dev && npm --prefix backend ci && npm run build && npm run db:migrate
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production

      # String de conexao do Neon. Preencher no painel.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"

      # Sem chave, o assistente cai para a resposta local e o app continua de pe.
      # A API da Anthropic e paga por uso; deixar em branco nao quebra nada.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5

      # FRONTEND_ORIGIN - OBRIGATORIA desde a v0.7.5.
      #
      # Ate a v0.7.4 esta variavel ficava de fora, com a justificativa de que o
      # backend serve o proprio frontend (mesma origem, sem CORS) e de que a URL
      # publica so existe depois de o servico ser criado. Sem ela, porem, o
      # backend caia no default `http://localhost:5173` e anunciava em CORS, com
      # credenciais, que confiava numa origem local - configuracao errada e
      # silenciosa.
      #
      # Agora, em producao, o processo NAO SOBE sem ela. Preencher no painel com
      # a origem publica do servico, so esquema e host, sem barra no fim:
      #
      #   https://nutriscan-h1wp.onrender.com
      #
      # O problema do "ovo e galinha" continua valendo para um servico NOVO: na
      # primeira criacao a URL ainda nao existe, o primeiro deploy falha, e e
      # preciso preencher a variavel e reimplantar. Para o servico que ja existe,
      # a URL e conhecida - basta preencher ANTES de publicar a v0.7.5.
      - key: FRONTEND_ORIGIN
        sync: false

      - key: SESSION_TTL_DAYS
        value: "30"

      # TRUST_PROXY - OBRIGATORIA em producao desde a v0.7.5, e explicita.
      # O Render termina TLS num proxy na frente do servico, entao `true` e o
      # valor certo AQUI. Sem proxy, `true` deixaria o cliente escolher o proprio
      # IP pelo `X-Forwarded-For` e fugir do teto de requisicoes por IP.
      - key: TRUST_PROXY
        value: "true"
